<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Card</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Inter", sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f33 100%);
            padding: 1.5rem;
            /* animasi latar */
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% {
                background: linear-gradient(145deg, #0b0e1a 0%, #1a1f33 100%);
            }
            50% {
                background: linear-gradient(145deg, #141b2b 0%, #232b4a 100%);
            }
            100% {
                background: linear-gradient(145deg, #0b0e1a 0%, #1a1f33 100%);
            }
        }

        /* ===== CARD UTAMA ===== */
        .profile-card {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 3rem 3rem 2.5rem 2.5rem;
            padding: 2.2rem 1.8rem 2rem;
            box-shadow:
                0 25px 50px -8px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.5s ease;
            /* animasi masuk */
            animation: cardFloat 1s ease-out forwards;
            opacity: 0;
            transform: translateY(40px) scale(0.96);
        }

        .profile-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 40px 70px -12px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        @keyframes cardFloat {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== AVATAR ===== */
        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 1.2rem;
        }

        .avatar-wrapper .ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #f093fb, #f5576c, #4facfe, #43e97b, #f093fb);
            background-size: 300% 300%;
            animation: spinRing 5s linear infinite;
            z-index: 0;
            filter: blur(0.8px);
            opacity: 0.7;
            transition: opacity 0.4s;
        }

        .profile-card:hover .ring {
            opacity: 1;
            animation-duration: 3s;
        }

        @keyframes spinRing {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .avatar-wrapper img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.4s, box-shadow 0.4s;
            background: #1e243b;
        }

        .avatar-wrapper img:hover {
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 15px 40px -6px rgba(0, 0, 0, 0.7);
        }

        /* status online */
        .status-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            z-index: 2;
            width: 22px;
            height: 22px;
            background: #43e97b;
            border-radius: 50%;
            border: 3px solid #0b0e1a;
            box-shadow: 0 0 0 2px rgba(67, 233, 123, 0.4);
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%,
            100% {
                box-shadow: 0 0 0 2px rgba(67, 233, 123, 0.4);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(67, 233, 123, 0);
            }
        }

        /* ===== NAMA & BIO ===== */
        .profile-name {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, #f6f9fc, #c8d6e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerName 4s ease-in-out infinite alternate;
        }

        @keyframes shimmerName {
            0% {
                filter: brightness(0.9) drop-shadow(0 0 2px rgba(255, 255, 255, 0.1));
            }
            100% {
                filter: brightness(1.3) drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
            }
        }

        .profile-title {
            text-align: center;
            font-size: 0.95rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.3px;
            margin-bottom: 0.4rem;
            transition: color 0.3s;
        }

        .profile-card:hover .profile-title {
            color: rgba(255, 255, 255, 0.85);
        }

        .profile-bio {
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.5);
            margin: 0.6rem 0 1.4rem;
            padding: 0 0.3rem;
            transition: color 0.3s;
        }

        .profile-card:hover .profile-bio {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ===== STATS ===== */
        .stats {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 2.5rem;
            padding: 0.9rem 0.6rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(4px);
            transition: background 0.4s, border-color 0.4s;
        }

        .profile-card:hover .stats {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .stat-item {
            text-align: center;
            flex: 1;
            transition: transform 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-4px) scale(1.05);
        }

        .stat-number {
            display: block;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 500;
            transition: color 0.3s;
        }

        .stat-item:hover .stat-label {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ===== SOCIAL LINKS ===== */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.3rem;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .social-link:hover::before {
            opacity: 1;
        }

        .social-link i {
            position: relative;
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .social-link:hover {
            transform: translateY(-6px) scale(1.1);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.5);
        }

        .social-link:hover i {
            transform: scale(1.1) rotate(3deg);
        }

        /* Warna khusus tiap sosial (hover) */
        .social-link[data-platform="github"]:hover {
            background: #24292e;
            border-color: #6e7681;
        }
        .social-link[data-platform="twitter"]:hover {
            background: #1da1f2;
            border-color: #1da1f2;
        }
        .social-link[data-platform="linkedin"]:hover {
            background: #0a66c2;
            border-color: #0a66c2;
        }
        .social-link[data-platform="instagram"]:hover {
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-color: #dc2743;
        }
        .social-link[data-platform="youtube"]:hover {
            background: #ff0000;
            border-color: #ff0000;
        }

        /* ===== TOMBOL AKSI ===== */
        .action-btn {
            display: block;
            width: 100%;
            padding: 0.9rem 0;
            border: none;
            border-radius: 3rem;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.4px;
            color: #ffffff;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 24px -6px rgba(79, 172, 254, 0.3);
            position: relative;
            overflow: hidden;
        }

        .action-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            opacity: 0;
            transition: opacity 0.5s ease;
            border-radius: 3rem;
        }

        .action-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 34px -8px rgba(79, 172, 254, 0.5);
        }

        .action-btn:hover::after {
            opacity: 1;
        }

        .action-btn span {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .action-btn span i {
            transition: transform 0.4s ease;
        }

        .action-btn:hover span i {
            transform: translateX(4px) scale(1.1);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .profile-card {
                padding: 1.8rem 1.2rem 1.6rem;
                border-radius: 2.5rem 2.5rem 2rem 2rem;
            }
            .avatar-wrapper {
                width: 110px;
                height: 110px;
            }
            .profile-name {
                font-size: 1.5rem;
            }
            .stat-number {
                font-size: 1.3rem;
            }
            .social-link {
                width: 44px;
                height: 44px;
                font-size: 1.1rem;
            }
            .action-btn {
                font-size: 0.9rem;
                padding: 0.8rem 0;
            }
        }

        @media (max-width: 380px) {
            .profile-card {
                padding: 1.4rem 0.9rem 1.4rem;
            }
            .avatar-wrapper {
                width: 96px;
                height: 96px;
            }
            .stats {
                flex-direction: column;
                gap: 0.5rem;
                padding: 0.8rem;
                border-radius: 2rem;
            }
            .stat-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 0.6rem;
            }
            .stat-number {
                font-size: 1.2rem;
            }
            .stat-label {
                font-size: 0.65rem;
            }
            .social-links {
                gap: 0.7rem;
            }
            .social-link {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
        }

        /* Animasi tambahan: elemen muncul bertahap */
        .profile-card>* {
            animation: fadeUp 0.8s ease forwards;
            opacity: 0;
        }
        .profile-card .avatar-wrapper {
            animation-delay: 0.1s;
        }
        .profile-card .profile-name {
            animation-delay: 0.2s;
        }
        .profile-card .profile-title {
            animation-delay: 0.3s;
        }
        .profile-card .profile-bio {
            animation-delay: 0.4s;
        }
        .profile-card .stats {
            animation-delay: 0.5s;
        }
        .profile-card .social-links {
            animation-delay: 0.6s;
        }
        .profile-card .action-btn {
            animation-delay: 0.7s;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="profile-card" role="main" aria-label="Kartu profil">

        <!-- Avatar -->
        <div class="avatar-wrapper">
            <div class="ring"></div>
            <!-- Ganti src dengan foto profil Anda -->
            <img src="https://i.pravatar.cc/300?img=11" alt="Foto profil" />
            <span class="status-badge" aria-label="Online"></span>
        </div>

        <!-- Nama & Bio -->
        <h1 class="profile-name">Alexandra Riviera</h1>
        <p class="profile-title">✨ UI/UX Designer &amp; Creative Developer</p>
        <p class="profile-bio">
            Membangun antarmuka yang bermakna dengan sentuhan animasi &amp; estetika modern.
        </p>

        <!-- Statistik -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" data-count="128">128</span>
                <span class="stat-label">Proyek</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" data-count="46">46</span>
                <span class="stat-label">Klien</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" data-count="3.2k">3.2k</span>
                <span class="stat-label">Pengikut</span>
            </div>
        </div>

        <!-- Social Links -->
        <div class="social-links">
            <a href="#" class="social-link" data-platform="github" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="#" class="social-link" data-platform="twitter" aria-label="Twitter">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="#" class="social-link" data-platform="linkedin" aria-label="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="#" class="social-link" data-platform="instagram" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="#" class="social-link" data-platform="youtube" aria-label="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
        </div>

        <!-- Tombol Aksi -->
        <button class="action-btn" id="contactBtn">
            <span>
                <i class="fas fa-paper-plane"></i> Hubungi Saya
            </span>
        </button>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== INTERAKSI TOMBOL =====
            const btn = document.getElementById('contactBtn');
            if (btn) {
                btn.addEventListener('click', function(e) {
                    // Efek klik : getar
                    this.style.transform = 'scale(0.96)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);

                    // Notifikasi sederhana
                    const originalText = this.innerHTML;
                    this.innerHTML = '<span><i class="fas fa-check-circle"></i> Terkirim!</span>';
                    setTimeout(() => {
                        this.innerHTML = originalText;
                    }, 1800);
                });
            }

            // ===== ANIMASI ANGKA STATISTIK (opsional) =====
            // Jika ingin angka naik dari 0 saat muncul, aktifkan kode di bawah
            // (dibiarkan non-aktif agar tidak mengganggu statis awal)
            /*
            const statNumbers = document.querySelectorAll('.stat-number');
            const observer = new IntersectionObserver((entries) => {
              entries.forEach(entry => {
                if (entry.isIntersecting) {
                  const el = entry.target;
                  const target = parseFloat(el.getAttribute('data-count') || el.textContent);
                  if (isNaN(target)) return;
                  let current = 0;
                  const step = Math.ceil(target / 40);
                  const timer = setInterval(() => {
                    current += step;
                    if (current >= target) {
                      el.textContent = target;
                      clearInterval(timer);
                    } else {
                      el.textContent = current;
                    }
                  }, 30);
                  observer.unobserve(el);
                }
              });
            }, { threshold: 0.5 });
            statNumbers.forEach(el => observer.observe(el));
            */

            // ===== TAMBAHAN: efek hover pada stat-item =====
            const statItems = document.querySelectorAll('.stat-item');
            statItems.forEach((item, index) => {
                item.addEventListener('mouseenter', function() {
                    const number = this.querySelector('.stat-number');
                    if (number) {
                        number.style.transition = 'transform 0.3s ease';
                        number.style.transform = 'scale(1.2)';
                        setTimeout(() => {
                            number.style.transform = 'scale(1)';
                        }, 300);
                    }
                });
            });

            // ===== PREVENT DEFAULT SOCIAL LINK (demo) =====
            document.querySelectorAll('.social-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    // efek klik ringan
                    this.style.transform = 'scale(0.9)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                    // notifikasi
                    const platform = this.getAttribute('data-platform') || 'sosial';
                    alert(`🔗 Anda menuju ${platform} (demo)`);
                });
            });

            // ===== RESPONSIVE: log ukuran layar (tidak wajib) =====
            console.log('✅ Profil card siap — ukuran layar: ' + window.innerWidth + 'px');

        })();
    </script>

</body>
</html>
