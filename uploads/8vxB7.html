<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>5 Digit Anti Twin Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* Background Video */

#bgVideo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(4px);
    z-index:-1;
}

/* Card */

.container{
    width:560px;
    max-width:95%;
    padding:35px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.12);

    border-radius:28px;

    box-shadow:
    0 0 30px rgba(255,215,0,.08),
    0 25px 60px rgba(0,0,0,.5);

    text-align:center;
}

/* Title */

.title{
    color:#fff;
    font-size:28px;
    font-weight:800;
    margin-bottom:30px;
}

/* Numbers */

.numbers{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:30px;
}

.box{
    width:80px;
    height:95px;

    background:white;

    border-radius:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:42px;
    font-weight:800;

    color:#111;

    box-shadow:
    0 10px 25px rgba(0,0,0,.2);

    transition:.3s;
}

.box:hover{
    transform:translateY(-4px);
}

/* Buttons */

.controls{
    display:flex;
    justify-content:center;
    gap:12px;
}

button{
    border:none;
    cursor:pointer;
    transition:.3s;
}

.generate{
    background:#FFD700;
    color:#111;

    padding:15px 30px;

    border-radius:14px;

    font-weight:700;
    font-size:15px;
}

.generate:hover{
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(255,215,0,.5);
}

.copy{
    background:rgba(255,255,255,.1);

    color:white;

    padding:15px 25px;

    border-radius:14px;

    font-weight:600;
}

.copy:hover{
    background:rgba(255,255,255,.2);
}

.status{
    margin-top:20px;
    color:#bdbdbd;
    font-size:13px;
}

@media(max-width:600px){

    .box{
        width:60px;
        height:75px;
        font-size:32px;
    }

    .title{
        font-size:22px;
    }

}

</style>
</head>
<body>

<!-- VIDEO BACKGROUND -->

<video autoplay muted loop playsinline id="bgVideo">
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- CONTENT -->

<div class="container">

    <div class="title">
        5 Digit Anti Twin Generator
    </div>

    <div class="numbers" id="numbers"></div>

    <div class="controls">

        <button class="generate" onclick="generateNumber()">
            Generate
        </button>

        <button class="copy" onclick="copyNumber()">
            Copy
        </button>

    </div>

    <div class="status" id="status">
        Siap Generate
    </div>

</div>

<script>

const numbersContainer =
document.getElementById("numbers");

let currentNumber = "";

/* Create Boxes */

for(let i=0;i<5;i++){

    const box = document.createElement("div");

    box.className = "box";

    box.innerText = "0";

    numbersContainer.appendChild(box);

}

/* Anti Twin Generator */

function generateNumber(){

    let digits = [];

    while(digits.length < 5){

        let n = Math.floor(Math.random()*10);

        if(!digits.includes(n)){
            digits.push(n);
        }

    }

    currentNumber = digits.join("");

    const boxes =
    document.querySelectorAll(".box");

    boxes.forEach((box,index)=>{

        let count = 0;

        const roll = setInterval(()=>{

            box.innerText =
            Math.floor(Math.random()*10);

            count++;

            if(count > 18){

                clearInterval(roll);

                box.innerText =
                digits[index];

            }

        },40);

    });

    document.getElementById("status").innerText =
    "Hasil : " + currentNumber;

}

/* Copy */

function copyNumber(){

    if(!currentNumber){

        alert("Generate dulu angka.");

        return;
    }

    navigator.clipboard.writeText(currentNumber);

    document.getElementById("status").innerText =
    "Berhasil disalin : " + currentNumber;

}

/* Auto Generate First Load */

generateNumber();

</script>

</body>
</html>
