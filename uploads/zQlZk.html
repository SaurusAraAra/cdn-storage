<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCPEDL Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0e0a;
      min-height: 100vh;
      color: #e8e8d0;
      font-family: 'Inter', sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    /* HERO */
    .hero {
      background: linear-gradient(180deg, #0f1a0f 0%, #0a0e0a 100%);
      border-bottom: 2px solid #1a2e1a;
      padding: 32px 16px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(94,159,43,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(13px, 3vw, 20px);
      color: #7ec850;
      text-shadow: 0 0 20px rgba(126,200,80,0.5), 2px 2px 0 #2d5a0e;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .hero-sub {
      font-family: 'VT323', monospace;
      font-size: 20px;
      color: #6b8a52;
      letter-spacing: 3px;
      margin-bottom: 28px;
    }
    .search-bar {
      display: flex;
      max-width: 680px;
      margin: 0 auto 16px;
      position: relative;
      z-index: 1;
    }
    .search-input {
      flex: 1;
      background: #111811;
      border: 2px solid #2a4a1a;
      border-right: none;
      color: #b8d4a0;
      font-family: 'VT323', monospace;
      font-size: 20px;
      padding: 10px 16px;
      outline: none;
      letter-spacing: 1px;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: #3a5a2a; }
    .search-input:focus { border-color: #5d9f2b; background: #131f13; }
    .search-btn {
      background: #3a7a12;
      border: 2px solid #2a6a08;
      border-left: 2px solid #4a9a1a;
      color: #d4f4a8;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background 0.1s, transform 0.05s;
      white-space: nowrap;
      letter-spacing: 1px;
    }
    .search-btn:hover { background: #4a9a1a; }
    .search-btn:active { transform: scale(0.97); }
    .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .sort-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      position: relative;
      z-index: 1;
    }
    .sort-chip {
      background: transparent;
      border: 1px solid #2a4a1a;
      color: #6b8a52;
      font-family: 'VT323', monospace;
      font-size: 16px;
      padding: 3px 14px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.1s;
    }
    .sort-chip.active { background: #1a3a0a; border-color: #5d9f2b; color: #a0d870; }
    .sort-chip:hover:not(.active) { border-color: #3a6a1a; color: #8aaa72; }

    .error-box {
      background: #150a0a;
      border: 2px solid #4a1a1a;
      color: #d46060;
      font-family: 'VT323', monospace;
      font-size: 16px;
      padding: 10px 16px;
      text-align: center;
      letter-spacing: 1px;
      max-width: 680px;
      margin: 8px auto 0;
      position: relative;
      z-index: 1;
    }

    /* MAIN */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 16px;
    }
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1a2e1a;
    }
    .results-label {
      font-family: 'VT323', monospace;
      font-size: 18px;
      color: #5d7a40;
      letter-spacing: 2px;
    }
    .results-label span { color: #7ec850; }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: #0d150d;
      border: 2px solid #1a2e1a;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s, background 0.15s;
      position: relative;
      overflow: hidden;
    }
    .card:hover { border-color: #5d9f2b; background: #101a10; transform: translateY(-2px); }
    .card:hover .card-overlay { opacity: 1; }
    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      background: #0a100a;
    }
    .card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: #0d150d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    .card-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      aspect-ratio: 16/9;
      background: linear-gradient(180deg, transparent 40%, rgba(10,20,10,0.9) 100%);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    .views-badge {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(0,0,0,0.75);
      border: 1px solid #2a4a1a;
      color: #7ec850;
      font-family: 'VT323', monospace;
      font-size: 14px;
      padding: 2px 8px;
      letter-spacing: 1px;
    }
    .card-body { padding: 12px 14px 14px; }
    .card-title {
      font-family: 'VT323', monospace;
      font-size: 20px;
      color: #c8e8a8;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-author {
      font-family: 'VT323', monospace;
      font-size: 15px;
      color: #4a6a32;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .card-author span { color: #6b9a4a; }
    .card-desc {
      font-size: 12px;
      color: #5a7a48;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      background: #0a1a08;
      border: 1px solid #1e3e12;
      color: #5a8040;
      font-family: 'VT323', monospace;
      font-size: 13px;
      padding: 1px 8px;
      letter-spacing: 0.5px;
    }

    /* STATE */
    .state-center { text-align: center; padding: 64px 16px; }
    .state-icon { font-size: 48px; margin-bottom: 16px; }
    .state-text { font-family: 'VT323', monospace; font-size: 22px; color: #3a5a2a; letter-spacing: 2px; }
    .state-sub { font-size: 13px; color: #2a3a22; margin-top: 8px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #1a2e1a;
      border-top-color: #5d9f2b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* PAGINATION */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 32px; flex-wrap: wrap; }
    .page-btn {
      background: transparent;
      border: 2px solid #1a2e1a;
      color: #5a7a48;
      font-family: 'VT323', monospace;
      font-size: 18px;
      padding: 4px 14px;
      cursor: pointer;
      transition: all 0.1s;
      letter-spacing: 1px;
    }
    .page-btn:hover:not(:disabled) { border-color: #3a5a1a; color: #8aaa72; }
    .page-btn.active { background: #1a3a0a; border-color: #5d9f2b; color: #a0d870; }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-dots { color: #2a4a1a; font-family: 'VT323', monospace; font-size: 18px; }

    /* MODAL */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
      overflow-y: auto;
      backdrop-filter: blur(4px);
    }
    .modal-bg.hidden { display: none; }
    .modal {
      background: #0d150d;
      border: 2px solid #3a6a1a;
      width: 100%;
      max-width: 760px;
      position: relative;
      animation: slideIn 0.15s ease-out;
    }
    @keyframes slideIn { from { transform: translateY(-16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-close {
      position: absolute; top: 12px; right: 12px;
      background: #1a0a0a;
      border: 2px solid #4a1a1a;
      color: #d46060;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 6px 10px;
      cursor: pointer;
      z-index: 10;
      transition: background 0.1s;
    }
    .modal-close:hover { background: #2a1212; }
    .modal-hero { width: 100%; max-height: 320px; object-fit: cover; display: block; }
    .modal-hero-placeholder {
      width: 100%; height: 200px;
      background: #0a120a;
      display: flex; align-items: center; justify-content: center;
      font-size: 56px;
      border-bottom: 2px solid #1a2e1a;
    }
    .modal-content { padding: 20px 24px 28px; }
    .modal-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(11px, 2.5vw, 16px);
      color: #a0d870;
      text-shadow: 2px 2px 0 #2d5a0e;
      margin-bottom: 8px;
      line-height: 1.6;
      padding-right: 60px;
    }
    .modal-meta { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #1a2e1a; }
    .meta-item { font-family: 'VT323', monospace; font-size: 16px; color: #5a7a48; letter-spacing: 1px; }
    .meta-item span { color: #8ac060; }
    .modal-section-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px; color: #3a6a1a; letter-spacing: 2px;
      margin-bottom: 10px; margin-top: 18px;
    }
    .modal-desc { font-size: 13px; color: #7a9a68; line-height: 1.7; white-space: pre-wrap; }
    .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
    .modal-tag { background: #0a1a08; border: 1px solid #1e3e12; color: #5a8040; font-family: 'VT323', monospace; font-size: 15px; padding: 2px 10px; }
    .modal-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .btn-link {
      background: #1a3a0a; border: 2px solid #2a5a10; color: #90d060;
      font-family: 'Press Start 2P', monospace; font-size: 8px;
      padding: 10px 16px; cursor: pointer; text-decoration: none;
      letter-spacing: 1px; transition: background 0.1s; display: inline-block;
    }
    .btn-link:hover { background: #253e13; border-color: #5d9f2b; }
    .modal-loading { padding: 80px 16px; text-align: center; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-title">⛏ MCPEDL SEARCH</div>
  <div class="hero-sub">MINECRAFT MODS · ADDONS · MAPS · RESOURCE PACKS</div>
  <div class="search-bar">
    <input id="searchInput" class="search-input" placeholder="Cari mod, addon, map..." />
    <button id="searchBtn" class="search-btn">SEARCH</button>
  </div>
  <div id="errorBox" class="error-box hidden"></div>
  <div class="sort-row">
    <button class="sort-chip active" data-sort="relevance">Relevance</button>
    <button class="sort-chip" data-sort="date">Newest</button>
    <button class="sort-chip" data-sort="popular">Popular</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div id="stateEmpty" class="state-center">
    <div class="state-icon">🧊</div>
    <div class="state-text">SEARCH FOR MODS</div>
    <div class="state-sub">Ketik kata kunci di atas dan tekan Search</div>
  </div>

  <div id="stateLoading" class="state-center hidden">
    <div class="spinner"></div>
    <div class="state-text">SEARCHING...</div>
  </div>

  <div id="stateNoResult" class="state-center hidden">
    <div class="state-icon">🕳</div>
    <div class="state-text">NO RESULTS FOUND</div>
    <div class="state-sub">Coba kata kunci lain</div>
  </div>

  <div id="resultsWrap" class="hidden">
    <div class="results-header">
      <div id="resultsLabel" class="results-label"></div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="pagination" class="pagination"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modalBg" class="modal-bg hidden">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕ CLOSE</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  const API_BASE = 'https://api.synoxcloud.xyz/search/mcpedl';
  const PROXY = 'https://corsproxy.io/?url=';

  const state = {
    query: '',
    sort: 'relevance',
    page: 1,
    total: 0,
    totalPages: 0,
    searched: false,
  };

  function proxied(url) {
    return PROXY + encodeURIComponent(url);
  }

  function formatNum(n) {
    if (!n) return '0';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n);
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // UI refs
  const $ = id => document.getElementById(id);
  const searchInput = $('searchInput');
  const searchBtn = $('searchBtn');
  const errorBox = $('errorBox');
  const stateEmpty = $('stateEmpty');
  const stateLoading = $('stateLoading');
  const stateNoResult = $('stateNoResult');
  const resultsWrap = $('resultsWrap');
  const resultsLabel = $('resultsLabel');
  const grid = $('grid');
  const pagination = $('pagination');
  const modalBg = $('modalBg');
  const modalBody = $('modalBody');

  function showState(which) {
    [stateEmpty, stateLoading, stateNoResult, resultsWrap].forEach(el => el.classList.add('hidden'));
    if (which) which.classList.remove('hidden');
  }

  function setError(msg) {
    if (msg) {
      errorBox.textContent = '⚠ ' + msg;
      errorBox.classList.remove('hidden');
    } else {
      errorBox.classList.add('hidden');
    }
  }

  // Sort chips
  document.querySelectorAll('.sort-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sort-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.sort = btn.dataset.sort;
      if (state.searched && state.query.trim()) {
        state.page = 1;
        doSearch();
      }
    });
  });

  async function doSearch() {
    const q = state.query.trim();
    if (!q) return;

    showState(stateLoading);
    setError(null);
    searchBtn.disabled = true;

    try {
      const url = `${API_BASE}?action=search&query=${encodeURIComponent(q)}&sort=${state.sort}&page=${state.page}`;
      const res = await fetch(proxied(url));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      const result = data?.result || {};
      const items = result?.results || [];
      state.total = result?.total || items.length;
      state.totalPages = result?.total_pages || Math.ceil(state.total / 20) || 1;
      state.searched = true;

      if (items.length === 0) {
        showState(stateNoResult);
        return;
      }

      renderResults(items);
      renderPagination();
      showState(resultsWrap);

    } catch (e) {
      setError('Gagal fetch: ' + e.message);
      showState(state.searched ? resultsWrap : stateEmpty);
    } finally {
      searchBtn.disabled = false;
    }
  }

  function renderResults(items) {
    resultsLabel.innerHTML = `<span>${items.length}</span> RESULTS${state.total > items.length ? ' OF ' + state.total : ''} · PAGE <span>${state.page}</span>`;

    grid.innerHTML = items.map((mod, i) => {
      const thumb = mod.image || '';
      const author = mod.user?.name || mod.user?.username || 'Unknown';
      const dl = mod.download_count;
      const cats = (mod.categories || []).slice(0, 3);
      const type = mod.type || '';

      return `
        <div class="card" data-idx="${i}" onclick="openModal(modsCache[${i}])">
          ${thumb
            ? `<img class="card-thumb" src="${esc(thumb)}" alt="${esc(mod.title)}" loading="lazy" onerror="this.style.display='none'" />`
            : `<div class="card-thumb-placeholder">🧱</div>`}
          <div class="card-overlay"></div>
          ${dl > 0 ? `<div class="views-badge">⬇ ${formatNum(dl)}</div>` : ''}
          <div class="card-body">
            <div class="card-title">${esc(mod.title || 'Unknown')}</div>
            <div class="card-author">by <span>${esc(author)}</span></div>
            ${mod.summary ? `<div class="card-desc">${esc(mod.summary)}</div>` : ''}
            <div class="card-tags">
              ${cats.map(t => `<span class="tag">${esc(t)}</span>`).join('')}
              ${type ? `<span class="tag">${esc(type)}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');

    window.modsCache = items;
  }

  function renderPagination() {
    const tp = state.totalPages;
    const p = state.page;
    if (tp <= 1) { pagination.innerHTML = ''; return; }

    const range = [];
    for (let i = Math.max(1, p - 2); i <= Math.min(tp, p + 2); i++) range.push(i);

    let html = `<button class="page-btn" ${p <= 1 ? 'disabled' : ''} onclick="goPage(${p - 1})">◀</button>`;

    if (range[0] > 1) {
      html += `<button class="page-btn" onclick="goPage(1)">1</button>`;
      if (range[0] > 2) html += `<span class="page-dots">···</span>`;
    }

    range.forEach(n => {
      html += `<button class="page-btn${n === p ? ' active' : ''}" onclick="goPage(${n})">${n}</button>`;
    });

    if (range[range.length - 1] < tp) {
      if (range[range.length - 1] < tp - 1) html += `<span class="page-dots">···</span>`;
      html += `<button class="page-btn" onclick="goPage(${tp})">${tp}</button>`;
    }

    html += `<button class="page-btn" ${p >= tp ? 'disabled' : ''} onclick="goPage(${p + 1})">▶</button>`;
    pagination.innerHTML = html;
  }

  function goPage(p) {
    state.page = p;
    doSearch();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Modal
  async function openModal(mod) {
    modalBg.classList.remove('hidden');
    document.body.style.overflow = 'hidden';

    modalBody.innerHTML = `
      <div class="modal-loading">
        <div class="spinner"></div>
        <div class="state-text">LOADING...</div>
      </div>
    `;

    let d = mod;
    try {
      const slug = mod.slug;
      if (slug) {
        const url = `${API_BASE}?action=detail&query=${encodeURIComponent(slug)}`;
        const res = await fetch(proxied(url));
        const data = await res.json();
        d = data?.result || mod;
      }
    } catch {
      d = mod;
    }

    const thumb = d.image || '';
    const author = d.user?.name || d.user?.username || '';
    const dl = d.download_count;
    const rating = d.rating ? Number(d.rating).toFixed(1) : null;
    const date = d.updated_at || d.created_at;
    const dateStr = date ? new Date(date).toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
    const desc = (d.summary || d.description || '').replace(/<[^>]+>/g, '').trim();
    const cats = d.categories || [];

    modalBody.innerHTML = `
      ${thumb
        ? `<img class="modal-hero" src="${esc(thumb)}" alt="${esc(d.title)}" onerror="this.style.display='none'" />`
        : `<div class="modal-hero-placeholder">🧱</div>`}
      <div class="modal-content">
        <div class="modal-title">${esc(d.title || 'Unknown')}</div>
        <div class="modal-meta">
          ${author ? `<div class="meta-item">👤 <span>${esc(author)}</span></div>` : ''}
          ${dl > 0 ? `<div class="meta-item">⬇ <span>${formatNum(dl)}</span></div>` : ''}
          ${rating ? `<div class="meta-item">⭐ <span>${rating}</span></div>` : ''}
          ${dateStr ? `<div class="meta-item">📅 <span>${dateStr}</span></div>` : ''}
          ${d.type ? `<div class="meta-item">📦 <span>${esc(d.type)}</span></div>` : ''}
        </div>
        ${desc ? `
          <div class="modal-section-title">// DESCRIPTION</div>
          <div class="modal-desc">${esc(desc.slice(0, 800))}${desc.length > 800 ? '...' : ''}</div>
        ` : ''}
        ${cats.length > 0 ? `
          <div class="modal-tags">
            ${cats.map(t => `<span class="modal-tag">${esc(t)}</span>`).join('')}
          </div>
        ` : ''}
        <div class="modal-links">
          ${d.url ? `<a class="btn-link" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">▶ OPEN IN MCPEDL</a>` : ''}
        </div>
      </div>
    `;
  }

  function closeModal() {
    modalBg.classList.add('hidden');
    document.body.style.overflow = '';
  }

  $('modalClose').addEventListener('click', closeModal);
  modalBg.addEventListener('click', e => { if (e.target === modalBg) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Search triggers
  searchBtn.addEventListener('click', () => {
    state.query = searchInput.value;
    state.page = 1;
    doSearch();
  });
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      state.query = searchInput.value;
      state.page = 1;
      doSearch();
    }
  });
</script>
</body>
</html>
