<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Device Lock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 99999;
        }
        #lockScreen {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            text-align: center;
            border: 1px solid #2a2a2a;
            position: relative;
        }
        #lockScreen h1 {
            color: #ff3333;
            font-size: 28px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #ff333388;
            margin-bottom: 10px;
        }
        #lockScreen .dev {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
        }
        #lockScreen .dev span {
            color: #ff6600;
            font-weight: bold;
        }
        #pinDisplay {
            background: #111;
            border-radius: 60px;
            padding: 18px;
            margin: 20px 0;
            border: 2px solid #333;
            color: #0f0;
            font-size: 32px;
            font-family: 'Courier New', monospace;
            letter-spacing: 12px;
            text-align: center;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s;
        }
        #pinDisplay.error {
            border-color: #ff3333;
            animation: shake 0.3s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 25px 0 20px;
        }
        .key {
            background: #222;
            color: #eee;
            border: none;
            border-radius: 60px;
            padding: 20px 0;
            font-size: 28px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 0 #0a0a0a;
            transition: all 0.05s;
            touch-action: manipulation;
        }
        .key:active {
            transform: translateY(6px);
            box-shadow: none;
            background: #2a2a2a;
        }
        .key.fn {
            background: #2a2a2a;
            color: #aaa;
            font-size: 18px;
        }
        .key.fn:active {
            background: #1a1a1a;
        }
        #statusMsg {
            color: #ff6666;
            font-size: 15px;
            margin-top: 10px;
            min-height: 24px;
        }
        .lock-icon {
            font-size: 60px;
            color: #ff3333;
            margin-bottom: 5px;
        }
        /* overlay tak tertembus */
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #0a0a0a;
            z-index: 99998;
            display: none;
        }
        /* untuk mencegah scroll */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Overlay anti-close -->
    <div id="overlay"></div>

    <div id="lockScreen">
        <div class="lock-icon">🔒</div>
        <h1>DEVICE LOCK</h1>
        <div class="dev">Developer: <span>Bilal Bahaya</span></div>

        <div id="pinDisplay">••••</div>
        <div id="statusMsg">Masukkan PIN</div>

        <div class="keypad">
            <button class="key" data-val="1">1</button>
            <button class="key" data-val="2">2</button>
            <button class="key" data-val="3">3</button>
            <button class="key" data-val="4">4</button>
            <button class="key" data-val="5">5</button>
            <button class="key" data-val="6">6</button>
            <button class="key" data-val="7">7</button>
            <button class="key" data-val="8">8</button>
            <button class="key" data-val="9">9</button>
            <button class="key fn" data-val="clear">⌫</button>
            <button class="key" data-val="0">0</button>
            <button class="key fn" data-val="enter">✓</button>
        </div>
    </div>

    <script>
        (function() {
            // === KONFIGURASI RAHASIA ===
            const PIN = "9922";           // TIDAK PERNAH DITAMPILKAN
            const DEV = "Bilal Bahaya";
            // ===========================

            // State
            let entered = "";
            const pinDisplay = document.getElementById('pinDisplay');
            const statusMsg = document.getElementById('statusMsg');
            const lockScreen = document.getElementById('lockScreen');

            // Cegah semua interaksi keluar
            function blockExit() {
                // Fullscreen paksa (agar tidak ada tombol close)
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    try {
                        document.documentElement.requestFullscreen?.() || 
                        document.documentElement.webkitRequestFullscreen?.();
                    } catch(e) {}
                }
                // Mencegah back/close
                window.history.pushState(null, "", window.location.href);
                window.onpopstate = function() {
                    window.history.pushState(null, "", window.location.href);
                    // Re-lock
                    showLock();
                };
                // Cegah sebelumunload
                window.onbeforeunload = function(e) {
                    e.preventDefault();
                    e.returnValue = "";
                    // Setelah close, saat dibuka lagi tetap lock
                    return "";
                };
                // Cegah reload dengan F5 / Ctrl+R
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                        e.preventDefault();
                        showLock();
                    }
                });
                // Cegah context menu (right click)
                document.addEventListener('contextmenu', e => e.preventDefault());
            }

            // Tampilkan kunci
            function showLock() {
                document.getElementById('lockScreen').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
                // Force fullscreen
                try {
                    document.documentElement.requestFullscreen?.() || 
                    document.documentElement.webkitRequestFullscreen?.();
                } catch(e) {}
                // Set status lock di localStorage
                localStorage.setItem('night_lock_active', 'true');
            }

            // Unlock (hanya jika PIN benar)
            function unlock() {
                localStorage.removeItem('night_lock_active');
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('overlay').style.display = 'none';
                if (document.fullscreenElement) {
                    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                }
                // Hapus beforeunload agar bisa keluar
                window.onbeforeunload = null;
                window.onpopstate = null;
                statusMsg.innerText = "✅ Terbuka!";
                statusMsg.style.color = "#0f0";
                // Tapi kita tetap pantau - jika user keluar, nanti di lock lagi via interval
            }

            // Cek status lock setiap detik (jika tidak aktif, aktifkan lagi)
            function persistLock() {
                setInterval(() => {
                    if (localStorage.getItem('night_lock_active') !== 'false') {
                        // Pastikan lock tetap tampil
                        const screen = document.getElementById('lockScreen');
                        if (screen.style.display === 'none') {
                            // Jika unlock tanpa PIN (curang), re-lock
                            showLock();
                            statusMsg.innerText = "⚠️ Akses ditolak!";
                            statusMsg.style.color = "#ff6666";
                        }
                    }
                }, 1000);
            }

            // Event tombol
            document.querySelectorAll('.key').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const val = this.dataset.val;
                    if (val === 'clear') {
                        entered = entered.slice(0, -1);
                    } else if (val === 'enter') {
                        if (entered === PIN) {
                            statusMsg.innerText = "✅ PIN benar! Membuka...";
                            statusMsg.style.color = "#0f0";
                            pinDisplay.classList.remove('error');
                            setTimeout(() => {
                                unlock();
                            }, 300);
                            return;
                        } else {
                            statusMsg.innerText = "❌ PIN salah!";
                            statusMsg.style.color = "#ff6666";
                            pinDisplay.classList.add('error');
                            setTimeout(() => pinDisplay.classList.remove('error'), 400);
                            entered = "";
                            updateDisplay();
                            return;
                        }
                    } else {
                        if (entered.length < 6) {
                            entered += val;
                        }
                    }
                    updateDisplay();
                });
            });

            function updateDisplay() {
                pinDisplay.innerText = '•'.repeat(entered.length) + '•'.repeat(4 - entered.length);
                if (entered.length > 0) {
                    statusMsg.innerText = "Masukkan PIN";
                    statusMsg.style.color = "#ff6666";
                }
            }

            // === INISIALISASI ===
            function init() {
                // Jika sebelumnya lock aktif atau pertama kali, lock
                if (localStorage.getItem('night_lock_active') !== 'false') {
                    showLock();
                } else {
                    // Jika tidak aktif, tetap tampilkan tapi bisa keluar?
                    // Tapi kita paksa aktif
                    showLock();
                }
                blockExit();
                persistLock();

                // Juga jika user mencoba menutup tab, kita coba buka ulang
                window.addEventListener('unload', function() {
                    // Coba buka tab baru dengan halaman ini
                    if (localStorage.getItem('night_lock_active') !== 'false') {
                        window.open(window.location.href, '_blank');
                    }
                });
            }

            // Jalankan
            init();

            // Override untuk mencegah inspeksi elemen
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                    e.preventDefault();
                }
            });
        })();
    </script>
</body>
</html>
